name: Check R2 manifest
on:
  # GitHub skips most cron ticks for this repository (one run in 12 h on 2026-11-19), so
  # the check follows every production run, which the Cloudflare scheduler keeps going.
  workflow_run:
    workflows: [Generate public model charts]
    types: [completed]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cds-r2-manifest-check
  cancel-in-progress: true
jobs:
  compare:
    # Read-only: public R2 URLs and this repository's Git history; no secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public_charts/
            /public_charts_r2_compare.py
            /data/public_charts_manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install --quiet requests==2.32.4
      - name: Compare the live R2 index with recent Git manifests
        run: python public_charts_r2_compare.py --depth 40
