name: Generate public model charts
run-name: Laptop WSL memory ${{ inputs.action || 'inventory' }}
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: inventory
        options: [inventory, apply, verify]
permissions:
  contents: read
concurrency:
  group: cds-laptop-wsl-maintenance
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Read Linux and Windows memory without changing settings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          mem=dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())
          print(json.dumps({'linux_'+key+'_mib':round(int(mem[key].split()[0])/1024,1)
                            for key in ('MemTotal','MemAvailable','SwapTotal','SwapFree')}))
          for key in ('memory.max','memory.current','memory.swap.max'):
              path=Path('/sys/fs/cgroup')/key
              if path.exists():
                  print(json.dumps({key:path.read_text().strip()}))
          powershell=Path('/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe')
          if powershell.exists():
              script=r'''
          [Console]::OutputEncoding=[System.Text.UTF8Encoding]::new()
          $os=Get-CimInstance Win32_OperatingSystem
          $cs=Get-CimInstance Win32_ComputerSystem
          $settings=@{}
          $config=Join-Path $env:USERPROFILE '.wslconfig'
          if(Test-Path -LiteralPath $config){
            foreach($line in (Get-Content -LiteralPath $config)){
              if($line -match '^\s*(memory|swap|processors)\s*=\s*([0-9.]+(?:GB|MB)?)\s*$'){
                $settings[$matches[1]]=$matches[2]
              }
            }
          }
          [pscustomobject]@{windows_total_gib=[math]::Round($cs.TotalPhysicalMemory/1GB,2);windows_free_gib=[math]::Round($os.FreePhysicalMemory/1MB,2);wsl_limits=$settings}|ConvertTo-Json -Compress
          '''
              result=subprocess.run([str(powershell),'-NoProfile','-NonInteractive','-Command',script],
                                    capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=40)
              print(result.stdout.strip() if result.returncode==0 else json.dumps({'windows_probe_exit':result.returncode}))
          else:
              print(json.dumps({'windows_probe':'interop unavailable'}))
          PY
      - name: Inspect existing runner launchers
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          home = Path.home()
          print(json.dumps({'distro': os.environ.get('WSL_DISTRO_NAME'), 'linux_user': home.name}))
          roots = [home / 'actions-runner-cds-public-charts', home / 'actions-runner/cds-vtg/actions-runner']
          for root in roots:
              print(json.dumps({'root': str(root), 'run_sh': (root / 'run.sh').exists(),
                                'launchers': [p.name for p in root.glob('start*.sh')]}))
              launcher = root / 'start-charts.sh'
              if launcher.exists():
                  allowed = []
                  for line in launcher.read_text().splitlines():
                      if line.startswith(('export PATH=', 'export LD_LIBRARY_PATH=', 'export CDS_', 'cd ', 'exec ', 'set ', '#!')):
                          allowed.append(line)
                  print(json.dumps({'launcher': str(launcher), 'allowed_lines': allowed}))
          workers = subprocess.run(['pgrep', '-x', 'Runner.Worker'], capture_output=True, text=True)
          print(json.dumps({'active_worker_count_including_this_probe': len(workers.stdout.splitlines())}))
          PY
      - name: Apply approved 10GB cap and schedule an idle-only restart
        if: inputs.action == 'apply'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import uuid
          workers = subprocess.run(['pgrep', '-x', 'Runner.Worker'], capture_output=True, text=True)
          if len(workers.stdout.splitlines()) != 1:
              raise RuntimeError('Another runner job is active; leave WSL unchanged')
          source = Path(os.environ['GITHUB_WORKSPACE']) / 'ops'
          print(json.dumps({'cwd':str(Path.cwd()), 'source':str(source), 'source_exists':source.exists()}))
          powershell = '/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'
          windows_temp = subprocess.check_output([powershell, '-NoProfile', '-NonInteractive', '-Command',
                          '[Console]::OutputEncoding=[System.Text.UTF8Encoding]::new(); Write-Output $env:TEMP'],
                          text=True, encoding='utf-8').strip()
          linux_temp = Path(subprocess.check_output(['wslpath', '-u', windows_temp], text=True).strip())
          if not str(linux_temp).startswith('/mnt/c/'):
              raise RuntimeError('Expected the Windows user temporary directory')
          deployed = linux_temp / ('CDS-WSL-Deploy-' + uuid.uuid4().hex)
          deployed.mkdir()
          for name in ('wsl-memory-apply.ps1', 'wsl-memory-restart.ps1', 'wsl-runners-start.sh'):
              shutil.copyfile(source / name, deployed / name)
          windows_script = subprocess.check_output(['wslpath', '-w', str(deployed / 'wsl-memory-apply.ps1')], text=True).strip()
          result = subprocess.run([powershell, '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                          '-File', windows_script, '-Distro', os.environ['WSL_DISTRO_NAME'],
                          '-LinuxUser', Path.home().name], capture_output=True, text=True,
                          encoding='utf-8', errors='replace', timeout=60)
          records = [json.loads(line) for line in result.stdout.splitlines() if line.startswith('{')]
          if result.returncode or not any(row.get('memory_limit') == '10GB' and row.get('helper_pid') for row in records):
              print(result.stdout)
              print(result.stderr)
              raise RuntimeError('The memory change and restart were not confirmed')
          print(json.dumps(records[-1]))
          PY
      - uses: actions/checkout@v4
        if: inputs.action == 'verify'
        with:
          ref: main
          path: live-production
          persist-credentials: false
      - name: Verify the effective memory and listener processes
        if: inputs.action == 'verify'
        working-directory: live-production
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          total = int(mem['MemTotal'].split()[0]) * 1024
          if not 9 * 1024**3 <= total <= 10.5 * 1024**3:
              raise RuntimeError('Expected an effective 10GB WSL cap')
          for root in [Path.home() / 'actions-runner-cds-public-charts', Path.home() / 'actions-runner/cds-vtg/actions-runner']:
              subprocess.run(['pgrep', '-f', '^' + str(root / 'bin/Runner.Listener')], check=True)
          from public_charts.resources import available_memory, worker_count, cmc_worker_count
          free = available_memory()
          workers = worker_count()
          print(json.dumps({'memory_total_gib':round(total/1024**3,2), 'available_memory_gib':round(free/1024**3,2),
                            'workers': workers, 'cmc_workers': cmc_worker_count(workers)}))
          PY
