name: Generate public model charts
run-name: Public model charts ${{ inputs.cycle || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; no Drive authentication, uploads, or deletion
        type: boolean
        default: true
      runner_mode:
        description: Add an idle laptop compute helper or use GitHub only
        type: choice
        options: [auto, github-hosted]
        default: auto
      model:
        type: choice
        options: [all, aifs, gfs, aigfs, cmc, ecmwf, icon, ukmo]
        default: all
      cycle:
        description: Optional UTC YYYYMMDDHH; blank checks recent cycles
        type: string
      hours:
        description: Optional forecast hours separated by spaces or commas
        type: string
      max_leads:
        description: Maximum processed leads per model in this batch
        type: number
        default: 2
      force:
        description: Explicitly rerender published charts
        type: boolean
        default: false
      run_minutes:
        description: Continuous dispatch budget, 0 uses normal defaults; no force
        type: number
        default: 0

permissions:
  contents: read
  actions: read

concurrency:
  group: cds-public-model-charts
  cancel-in-progress: false

jobs:
  produce:
    if: vars.PUBLIC_CHARTS_ENABLED == 'true' || inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PUBLIC_CHARTS_DRIVE_CLIENT_ID: ${{ secrets.PUBLIC_CHARTS_DRIVE_CLIENT_ID }}
      PUBLIC_CHARTS_DRIVE_CLIENT_SECRET: ${{ secrets.PUBLIC_CHARTS_DRIVE_CLIENT_SECRET }}
      PUBLIC_CHARTS_DRIVE_REFRESH_TOKEN: ${{ secrets.PUBLIC_CHARTS_DRIVE_REFRESH_TOKEN }}
      PUBLIC_CHARTS_DRIVE_FOLDER_ID: ${{ secrets.PUBLIC_CHARTS_DRIVE_FOLDER_ID }}
      PUBLIC_CHARTS_DRIVE_ACCOUNT_EMAIL: ${{ secrets.PUBLIC_CHARTS_DRIVE_ACCOUNT_EMAIL }}
      PUBLIC_CHARTS_DRIVE2_CLIENT_ID: ${{ secrets.PUBLIC_CHARTS_DRIVE2_CLIENT_ID }}
      PUBLIC_CHARTS_DRIVE2_CLIENT_SECRET: ${{ secrets.PUBLIC_CHARTS_DRIVE2_CLIENT_SECRET }}
      PUBLIC_CHARTS_DRIVE2_REFRESH_TOKEN: ${{ secrets.PUBLIC_CHARTS_DRIVE2_REFRESH_TOKEN }}
      PUBLIC_CHARTS_DRIVE2_FOLDER_ID: ${{ secrets.PUBLIC_CHARTS_DRIVE2_FOLDER_ID }}
      PUBLIC_CHARTS_DRIVE2_ACCOUNT_EMAIL: ${{ secrets.PUBLIC_CHARTS_DRIVE2_ACCOUNT_EMAIL }}
      PUBLIC_CHARTS_STORAGE_LAYOUT: balanced-v1
      # R2 manifest dual-write: off until secrets exist, then shadow by default.
      PUBLIC_CHARTS_R2_MODE: ${{ vars.PUBLIC_CHARTS_R2_MODE }}
      PUBLIC_CHARTS_R2_ACCOUNT_ID: ${{ secrets.PUBLIC_CHARTS_R2_ACCOUNT_ID }}
      PUBLIC_CHARTS_R2_ACCESS_KEY_ID: ${{ secrets.PUBLIC_CHARTS_R2_ACCESS_KEY_ID }}
      PUBLIC_CHARTS_R2_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_CHARTS_R2_SECRET_ACCESS_KEY }}
      PUBLIC_CHARTS_R2_BUCKET: ${{ secrets.PUBLIC_CHARTS_R2_BUCKET }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      MODEL_INPUT: ${{ inputs.model || 'all' }}
      CYCLE_INPUT: ${{ inputs.cycle }}
      START_CYCLE_INPUT: ${{ vars.PUBLIC_CHARTS_START_CYCLE }}
      HOURS_INPUT: ${{ inputs.hours }}
      LIMIT_INPUT: ${{ inputs.max_leads || 2 }}
      WORKERS_INPUT: ${{ vars.PUBLIC_CHARTS_WORKERS || 'auto' }}
      UPLOAD_WORKERS_INPUT: ${{ vars.PUBLIC_CHARTS_UPLOAD_WORKERS || 3 }}
      PREPARE_WORKERS_INPUT: ${{ vars.PUBLIC_CHARTS_PREPARE_WORKERS || 4 }}
      TIME_BUDGET_INPUT: ${{ vars.PUBLIC_CHARTS_TIME_BUDGET_MINUTES || 20 }}
      MINUTES_INPUT: ${{ inputs.run_minutes || 0 }}
      FORCE_INPUT: ${{ inputs.force }}
      HELPER_AVAILABLE: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public_charts/
            /public_charts_run.py
            /public_charts_runner.py
            /public_charts_runtime.py
            /public_charts_action.py
            /public_charts_publish.py
            /public_charts_drive.py
            /vtg_drive_archive.py
            /requirements-public-charts.txt
            /requirements-icon-charts.txt
            /data/public_charts_manifest.json
      - name: Select optional helper on the coordinator
        id: runner
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          RUNNER_MODE: ${{ inputs.runner_mode || 'auto' }}
          DUAL_COMPUTE_ENABLED: ${{ vars.PUBLIC_CHARTS_DUAL_COMPUTE_ENABLED }}
        run: python public_charts_runner.py --mode "$RUNNER_MODE"
      - name: Configure isolated runtime paths
        shell: bash
        run: |
          printf '%s\n' \
            "CHART_WORK=$RUNNER_TEMP/cds-public-charts" \
            "PUBLIC_CHARTS_MAP_DIR=$RUNNER_TOOL_CACHE/cds-public-charts/maps-v1" \
            "PUBLIC_CHARTS_ICON_GRID_DIR=$RUNNER_TOOL_CACHE/cds-public-charts/icon-grid-v1" \
            "MPLCONFIGDIR=$RUNNER_TEMP/public-charts-mpl" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            requirements-public-charts.txt
            requirements-icon-charts.txt
      - name: Install isolated rendering runtime
        if: env.DRY_RUN != 'true'
        run: python public_charts_runtime.py --install-runtime "$RUNNER_TOOL_CACHE/cds-public-charts"
      - name: Verify separate Drive account before downloads
        if: env.DRY_RUN != 'true'
        run: python public_charts_run.py --check-drive
      - uses: actions/setup-node@v4
        if: env.HELPER_AVAILABLE == 'true' && env.DRY_RUN != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public_charts/transport/package-lock.json
      - name: Install verified helper transport
        if: env.HELPER_AVAILABLE == 'true' && env.DRY_RUN != 'true'
        run: python public_charts_runtime.py --install-transport "$RUNNER_TOOL_CACHE/cds-public-charts"
      - uses: actions/cache/restore@v4
        id: map-cache
        timeout-minutes: 2
        continue-on-error: true
        if: env.DRY_RUN != 'true'
        with:
          path: ${{ env.PUBLIC_CHARTS_MAP_DIR }}
          key: public-charts-maps-v1
      - uses: actions/cache/restore@v4
        id: grid-cache
        timeout-minutes: 2
        continue-on-error: true
        if: env.DRY_RUN != 'true'
        with:
          path: ${{ env.PUBLIC_CHARTS_ICON_GRID_DIR }}
          key: public-charts-icon-grid-v1
      - uses: actions/cache/restore@v4
        id: prefix-cache
        timeout-minutes: 2
        continue-on-error: true
        if: env.DRY_RUN != 'true'
        with:
          path: ${{ env.CHART_WORK }}/raw-cache/checkpoints
          key: public-charts-prefix-v1-${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-charts-prefix-v1-${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') }}-
            ${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') == 'c0e69ec3d9c5f169751a0d78003ac188c34a002bac30477b66f00bdbf48b1aad' && 'public-charts-prefix-v1-45ab3468b0855fc956c4b2a725c4af444aedefc6bb47fe8d9f756cc3eedf6ac3-' || 'no-compatible-previous-prefix-' }}
            ${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') == '45ab3468b0855fc956c4b2a725c4af444aedefc6bb47fe8d9f756cc3eedf6ac3' && 'public-charts-prefix-v1-342275140e4882c9ff142b51c84ba8f54721828e55dc4f6d9d0569ce532ecd33-' || 'no-compatible-legacy-prefix-' }}
      - name: Prepare map data
        if: env.DRY_RUN != 'true'
        run: python public_charts_runtime.py --prepare-maps
      - uses: actions/cache/restore@v4
        id: input-cache
        timeout-minutes: 2
        continue-on-error: true
        if: env.DRY_RUN != 'true'
        with:
          path: |
            ${{ env.CHART_WORK }}/raw-cache/prepared
            ${{ env.CHART_WORK }}/raw-cache/partial-fields
          key: public-charts-input-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-charts-input-v2-
      - name: Limit restored input cache
        if: env.DRY_RUN != 'true'
        run: python public_charts_runtime.py --prune-inputs "$CHART_WORK"
      - name: Produce available forecast leads
        id: generate
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const {spawn} = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('python', ['public_charts_action.py', 'coordinator'], {stdio: 'inherit', env: process.env});
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error(`Production exited (${code})`)));
            });
      - name: Publish verified URL manifest only
        id: publish
        if: always() && env.DRY_RUN != 'true' && steps.generate.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CHART_WORK/cleanup-plan.json"
          python public_charts_publish.py
      - name: Remove expired chart files only after publication
        if: steps.publish.outcome == 'success' && env.DRY_RUN != 'true'
        run: python public_charts_run.py --finalize-cleanup --workdir "$CHART_WORK"
      - name: Limit derived checkpoint cache
        id: prune
        if: always() && env.DRY_RUN != 'true'
        run: python public_charts_runtime.py --prune-checkpoints "$CHART_WORK/raw-cache/checkpoints"
      - name: Save verified checkpoints even after a model failure
        timeout-minutes: 2
        continue-on-error: true
        if: always() && env.DRY_RUN != 'true' && steps.prune.outcome == 'success' && steps.prefix-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CHART_WORK }}/raw-cache/checkpoints
          key: ${{ steps.prefix-cache.outputs.cache-primary-key }}
      - name: Report production failure
        if: always() && steps.generate.outcome == 'failure'
        run: exit 1
      - name: Limit reusable regional inputs
        id: input-prune
        if: always() && env.DRY_RUN != 'true'
        run: python public_charts_runtime.py --prune-inputs "$CHART_WORK"
      - uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        if: always() && env.DRY_RUN != 'true' && steps.input-prune.outcome == 'success' && steps.input-cache.outputs.cache-primary-key != ''
        with:
          path: |
            ${{ env.CHART_WORK }}/raw-cache/prepared
            ${{ env.CHART_WORK }}/raw-cache/partial-fields
          key: ${{ steps.input-cache.outputs.cache-primary-key }}
      - name: Save initialized maps without holding the next batch
        uses: actions/cache/save@v4
        timeout-minutes: 1
        continue-on-error: true
        if: always() && env.DRY_RUN != 'true' && steps.map-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PUBLIC_CHARTS_MAP_DIR }}
          key: public-charts-maps-v1
      - name: Save initialized ICON grid without holding the next batch
        uses: actions/cache/save@v4
        timeout-minutes: 1
        continue-on-error: true
        if: always() && env.DRY_RUN != 'true' && steps.grid-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PUBLIC_CHARTS_ICON_GRID_DIR }}
          key: public-charts-icon-grid-v1
