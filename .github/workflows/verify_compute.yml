name: Verify distributed chart compute
on:
  workflow_dispatch:
    inputs:
      helper_runner:
        description: Verify with a hosted helper or the idle dedicated laptop
        type: choice
        options: [github-hosted, laptop]
        default: github-hosted
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      VERIFY_HELPER_RUNNER: ${{ inputs.helper_runner || 'github-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            requirements-public-charts.txt
            requirements-icon-charts.txt
      - name: Verify cold and warm rendering runtime
        run: |
          python public_charts_runtime.py --install-runtime "$RUNNER_TOOL_CACHE/cds-public-charts"
          python public_charts_runtime.py --install-runtime "$RUNNER_TOOL_CACHE/cds-public-charts"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public_charts/transport/package-lock.json
      - name: Verify cold and warm helper transport
        run: |
          python public_charts_runtime.py --install-transport "$RUNNER_TOOL_CACHE/cds-public-charts"
          python public_charts_runtime.py --install-transport "$RUNNER_TOOL_CACHE/cds-public-charts"
      - name: Verify coordinator and separate helper job
        uses: actions/github-script@v8
        with:
          script: |
            const {spawn} = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('python', ['public_charts_remote_smoke.py'], {stdio: 'inherit', env: process.env});
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error(`Compute verification exited (${code})`)));
            });
