name: Diagnose laptop helper workspace
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cds-chart-helper-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, cds-public-charts]
    timeout-minutes: 3
    steps:
      - name: Inspect existing workspace without checkout or changes
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const {spawnSync} = require('node:child_process');
            const root = process.env.GITHUB_WORKSPACE;
            const files = ['public_charts_action.py', 'public_charts_helper.py', 'public_charts_runtime.py',
              'public_charts_run.py', 'public_charts/remote.py', 'public_charts/transport/package.json'];
            const describe = file => {
              const full = path.join(root, file);
              try {
                const stat = fs.lstatSync(full);
                return {file, exists: true, bytes: stat.size, symlink: stat.isSymbolicLink(), realpath: fs.realpathSync(full)};
              } catch (error) { return {file, exists: false, error: error.code}; }
            };
            console.log(JSON.stringify({event: 'helper_workspace_diagnostic', root, cwd: process.cwd(),
              root_realpath: fs.existsSync(root) ? fs.realpathSync(root) : null, files: files.map(describe)}));
            const checks = [
              ['rev-parse', '--show-toplevel', '--git-dir', 'HEAD'],
              ['ls-tree', 'HEAD', ...files],
              ['ls-files', '-v', '--', ...files],
              ['config', '--show-origin', '--get-regexp', '^(core\\.(sparsecheckout|sparsecheckoutcone|worktree|hookspath)|extensions\\.worktreeconfig)$'],
              ['status', '--short', '--', ...files]
            ];
            for (const args of checks) {
              const result = spawnSync('git', ['-c', `safe.directory=${root}`, ...args], {cwd: root, encoding: 'utf8'});
              console.log(JSON.stringify({event: 'helper_git_diagnostic', args, status: result.status,
                stdout: result.stdout?.slice(0, 10000), stderr: result.stderr?.slice(0, 1000)}));
            }
            const check = spawnSync('python3', ['-c',
              'import json,os,sys; from pathlib import Path; print(json.dumps({"cwd":os.getcwd(),"executable":sys.executable,"files":{p:Path(p).is_file() for p in ["public_charts_action.py","public_charts_helper.py","public_charts_runtime.py"]}}))'],
              {cwd: root, encoding: 'utf8'});
            console.log(JSON.stringify({event:'helper_python_diagnostic', status:check.status,
              stdout:check.stdout?.slice(0,4000), stderr:check.stderr?.slice(0,1000)}));
