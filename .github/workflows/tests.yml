name: Test public chart pipeline
on:
  push:
    paths: ['public_charts/**', 'public_charts_*.py', 'tests/**', 'cloudflare/**', 'requirements-public-charts.txt', 'requirements-icon-charts.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['public_charts/**', 'public_charts_*.py', 'tests/**', 'cloudflare/**', 'requirements-public-charts.txt', 'requirements-icon-charts.txt', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            requirements-public-charts.txt
            requirements-icon-charts.txt
      - run: python -m pip install -r requirements-icon-charts.txt
      - run: python -m unittest discover -s tests -p 'test_public_charts*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_worker.mjs
