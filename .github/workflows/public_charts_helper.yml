name: Public chart compute helper
run-name: Chart compute helper ${{ inputs.session }}
on:
  workflow_dispatch:
    inputs:
      session:
        type: string
        required: true
      code_sha:
        type: string
        required: true
      smoke:
        type: boolean
        default: false
      smoke_runner:
        type: choice
        options: [github-hosted, laptop]
        default: github-hosted
permissions:
  contents: read
  actions: read
concurrency:
  group: cds-public-chart-compute-helper-${{ inputs.smoke && 'smoke' || 'production' }}
  cancel-in-progress: true
jobs:
  compute:
    runs-on: ${{ fromJSON(inputs.smoke && inputs.smoke_runner != 'laptop' && '"ubuntu-24.04"' || '["self-hosted","linux","cds-public-charts"]') }}
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      HELPER_SESSION: ${{ inputs.session }}
      HELPER_CODE_SHA: ${{ inputs.code_sha }}
      HELPER_SMOKE: ${{ inputs.smoke }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public_charts/
            /public_charts_action.py
            /public_charts_helper.py
            /public_charts_runtime.py
            /requirements-public-charts.txt
            /requirements-icon-charts.txt
      - name: Verify compute entry points before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f public_charts_action.py
          test -f public_charts_helper.py
          test -f public_charts_runtime.py
          git ls-files -v -- public_charts_action.py public_charts_helper.py
      - name: Configure isolated compute paths
        shell: bash
        run: |
          cache_work="$RUNNER_TEMP/cds-chart-helper"
          laptop_cache=false
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted && -f public_charts/laptop.py ]]; then
            cache_work="$RUNNER_TOOL_CACHE/cds-public-charts/laptop-cache-v1"
            laptop_cache=true
          fi
          printf '%s\n' \
            "CHART_WORK=$RUNNER_TEMP/cds-chart-helper" \
            "CHART_CACHE_WORK=$cache_work" \
            "LAPTOP_CACHE_ENABLED=$laptop_cache" \
            "PUBLIC_CHARTS_MAP_DIR=$RUNNER_TOOL_CACHE/cds-public-charts/maps-v1" \
            "PUBLIC_CHARTS_ICON_GRID_DIR=$RUNNER_TOOL_CACHE/cds-public-charts/icon-grid-v1" \
            "MPLCONFIGDIR=$RUNNER_TEMP/chart-helper-mpl" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Clean up verified cache savers from completed laptop jobs
        if: env.LAPTOP_CACHE_ENABLED == 'true'
        timeout-minutes: 1
        continue-on-error: true
        run: python -m public_charts.laptop
      - name: Install isolated calculation runtime
        run: python public_charts_runtime.py --install-runtime "$RUNNER_TOOL_CACHE/cds-public-charts"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install artifact transport
        run: python public_charts_runtime.py --install-transport "$RUNNER_TOOL_CACHE/cds-public-charts"
      - name: Check persistent laptop caches
        id: local-cache
        if: env.LAPTOP_CACHE_ENABLED == 'true'
        shell: bash
        env:
          CHECKPOINT_REVISION: ${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py', 'public_charts/ukmo.py') }}
        run: |
          python public_charts_runtime.py --prepare-laptop-checkpoints "$CHART_CACHE_WORK" "$CHECKPOINT_REVISION"
          cold() {
            local name="$1" pattern="$2"
            shift 2
            for dir in "$@"; do
              if [[ -d "$dir" && -n "$(find "$dir" -type f -name "$pattern" -print -quit)" ]]; then
                return 0
              fi
            done
            printf '%s=true\n' "$name" >> "$GITHUB_OUTPUT"
          }
          cold maps '*.shp' "$PUBLIC_CHARTS_MAP_DIR"
          cold grid '*.npz' "$PUBLIC_CHARTS_ICON_GRID_DIR"
          cold prefix '*.npz' "$CHART_CACHE_WORK/raw-cache/checkpoints"
          cold inputs '*.npz' "$CHART_CACHE_WORK/raw-cache/prepared" "$CHART_CACHE_WORK/raw-cache/partial-fields"
      - uses: actions/cache/restore@v4
        id: map-cache
        if: env.LAPTOP_CACHE_ENABLED != 'true' || steps.local-cache.outputs.maps == 'true'
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ env.PUBLIC_CHARTS_MAP_DIR }}
          key: public-charts-maps-v1
      - uses: actions/cache/restore@v4
        id: grid-cache
        if: env.LAPTOP_CACHE_ENABLED != 'true' || steps.local-cache.outputs.grid == 'true'
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ env.PUBLIC_CHARTS_ICON_GRID_DIR }}
          key: public-charts-icon-grid-v1
      - uses: actions/cache/restore@v4
        id: prefix-cache
        if: env.LAPTOP_CACHE_ENABLED != 'true' || steps.local-cache.outputs.prefix == 'true'
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ env.CHART_CACHE_WORK }}/raw-cache/checkpoints
          key: public-charts-helper-prefix-v1-${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-charts-helper-prefix-v1-${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') }}-
            public-charts-prefix-v1-${{ hashFiles('public_charts/diagnostics.py', 'public_charts/extended_sources.py') }}-
      - name: Prepare chart maps
        run: python public_charts_runtime.py --prepare-maps
      - uses: actions/cache/restore@v4
        id: input-cache
        if: env.LAPTOP_CACHE_ENABLED != 'true' || steps.local-cache.outputs.inputs == 'true'
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            ${{ env.CHART_CACHE_WORK }}/raw-cache/prepared
            ${{ env.CHART_CACHE_WORK }}/raw-cache/partial-fields
          key: public-charts-input-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-charts-input-v2-
      - name: Limit restored input cache
        shell: bash
        run: |
          args=(--prune-inputs "$CHART_CACHE_WORK")
          if [[ "$LAPTOP_CACHE_ENABLED" == true ]]; then
            args+=(--prune-without-rehashing)
          fi
          python public_charts_runtime.py "${args[@]}"
      - name: Compute leased forecast leads
        id: compute
        uses: actions/github-script@v8
        with:
          script: |
            const {spawn} = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('python', ['public_charts_action.py', 'helper'], {stdio: 'inherit', env: process.env});
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error(`Compute helper exited (${code})`)));
            });
      - name: Limit reusable regional inputs
        id: input-prune
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=(--prune-inputs "$CHART_CACHE_WORK")
          if [[ "$LAPTOP_CACHE_ENABLED" == true ]]; then
            args+=(--prune-without-rehashing)
          fi
          python public_charts_runtime.py "${args[@]}"
      - uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ !cancelled() && env.LAPTOP_CACHE_ENABLED != 'true' && steps.input-prune.outcome == 'success' && steps.input-cache.outputs.cache-primary-key != '' }}
        with:
          path: |
            ${{ env.CHART_CACHE_WORK }}/raw-cache/prepared
            ${{ env.CHART_CACHE_WORK }}/raw-cache/partial-fields
          key: ${{ steps.input-cache.outputs.cache-primary-key }}
      - name: Prune verified calculation checkpoints
        id: prune
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=(--prune-checkpoints "$CHART_CACHE_WORK/raw-cache/checkpoints")
          if [[ "$LAPTOP_CACHE_ENABLED" == true ]]; then
            args+=(--checkpoint-max-mib 2048)
          fi
          python public_charts_runtime.py "${args[@]}"
      - uses: actions/cache/save@v4
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ !cancelled() && env.LAPTOP_CACHE_ENABLED != 'true' && steps.prune.outcome == 'success' && steps.prefix-cache.outputs.cache-primary-key != '' }}
        with:
          path: ${{ env.CHART_CACHE_WORK }}/raw-cache/checkpoints
          key: ${{ steps.prefix-cache.outputs.cache-primary-key }}
      - name: Save initialized maps without holding the next batch
        uses: actions/cache/save@v4
        timeout-minutes: 1
        continue-on-error: true
        if: ${{ !cancelled() && env.LAPTOP_CACHE_ENABLED != 'true' && steps.map-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.PUBLIC_CHARTS_MAP_DIR }}
          key: public-charts-maps-v1
      - name: Save initialized ICON grid without holding the next batch
        uses: actions/cache/save@v4
        timeout-minutes: 1
        continue-on-error: true
        if: ${{ !cancelled() && env.LAPTOP_CACHE_ENABLED != 'true' && steps.grid-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.PUBLIC_CHARTS_ICON_GRID_DIR }}
          key: public-charts-icon-grid-v1
